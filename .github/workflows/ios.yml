name: iOS build and submit

# Builds the iOS app on a free GitHub macOS runner with `eas build --local`
# (no EAS cloud quota) and submits to TestFlight.
# Public repo -> GitHub-hosted macOS runners are free.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Repository secrets):
#   EXPO_TOKEN   Expo access token (expo.dev -> Settings -> Access tokens). Required for the build.
#   ASC_KEY_B64  AuthKey_YRMDQTX998.p8, base64-encoded. Required only for the TestFlight submit.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm i -g eas-cli

      - name: Build iOS (local, no EAS quota)
        run: eas build --platform ios --profile production --local --non-interactive --output ./app.ipa

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-chores-ipa
          path: ./app.ipa
          if-no-files-found: ignore

      - name: Submit to TestFlight
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          if [ -z "$ASC_KEY_B64" ]; then
            echo "::warning::ASC_KEY_B64 secret is empty. The build succeeded and the IPA is saved as an artifact. Set the ASC_KEY_B64 repository secret and re-run to auto-submit to TestFlight."
            exit 0
          fi
          mkdir -p asc
          printf '%s' "$ASC_KEY_B64" | base64 --decode > asc/AuthKey.p8
          eas submit --platform ios --profile ci --path ./app.ipa --non-interactive
